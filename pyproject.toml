[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lynxclaw"
version = "0.1.0"
description = "Lightweight AI agent runtime platform"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "lynxpurr"},
]
keywords = ["ai-agent", "docker", "telegram", "feishu", "lark", "claude", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "aiosqlite>=0.20",
    "aiogram>=3.7",
    "watchdog>=4.0",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "claude-agent-sdk>=0.0.1",
    "lark-oapi>=1.3",
    "croniter>=2.0",
    "prometheus_client>=0.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/lynxpurr/lynxclaw"
Documentation = "https://github.com/lynxpurr/lynxclaw/blob/main/docs/ARCHITECTURE.md"
Repository = "https://github.com/lynxpurr/lynxclaw.git"
Issues = "https://github.com/lynxpurr/lynxclaw/issues"
Changelog = "https://github.com/lynxpurr/lynxclaw/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
